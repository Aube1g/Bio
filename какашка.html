<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XGO — авто-демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root{
    --md-primary: #D0BCFF;
    --md-primary-container: #4F378B;
    --md-on-primary-container: #EADDFF;
    --md-secondary: #CCC2DC;
    --md-surface: #141218;
    --md-surface-container: #1D1B20;
    --md-surface-container-high: #2B2930;
    --md-surface-container-highest: #36343B;
    --md-surface-container-low: #1B191E;
    --md-on-surface: #E6E0E9;
    --md-on-surface-variant: #CAC4D0;
    --md-outline: #938F99;
    --md-outline-variant: #49454F;
    --md-success: #9CCC65;
    --md-error: #F2B8B5;
    --phone-frame: #0F0D13;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 15%, #241713 0%, #0c0806 70%);
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    padding:28px 12px;
  }
  .material-symbols-rounded{
    font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
    vertical-align:middle;
    line-height:1;
  }
  .phone-container{
    position:relative;
    width:100%;
    max-width:300px;
    aspect-ratio:9/19.5;
  }
  .phone-mockup{
    width:100%;
    height:100%;
    background:var(--phone-frame);
    border-radius:2.8rem;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.05),
      inset 0 0 0 8px var(--phone-frame),
      inset 0 0 0 10px #1A1311,
      0 30px 60px -10px rgba(0,0,0,0.8),
      0 0 40px rgba(255,181,157,0.08);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .status-bar{
    position:absolute;
    top:0;left:0;right:0;
    height:32px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:60;
    color:#fff;
    font-size:11px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .status-icons{display:flex;align-items:center;gap:4px;}
  .battery-shell{
    width:22px;height:11px;
    border:1px solid rgba(255,255,255,0.7);
    border-radius:3px;
    position:relative;
    padding:1px;
    display:flex;
  }
  .battery-shell::after{
    content:'';
    position:absolute;
    right:-3px;top:3px;
    width:2px;height:5px;
    background:rgba(255,255,255,0.7);
    border-radius:0 1px 1px 0;
  }
  .battery-fill{background:#fff;border-radius:1px;height:100%;}
  .battery-fill.low{background:var(--md-error);}
  .battery-fill.charging{background:var(--md-success);}
  .charging-bolt{position:absolute;left:6px;top:-1px;font-size:10px;color:#0A0807;z-index:2;}

  .phone-notch{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:28%;height:20px;background:#000;border-radius:16px;z-index:65;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:width .45s cubic-bezier(.2,.9,.25,1), height .45s cubic-bezier(.2,.9,.25,1), border-radius .45s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 0 0 1px rgba(255,255,255,0.04);
  }
  .phone-notch.expanded{
    width:78%;height:44px;border-radius:22px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .notch-content{
    display:flex;align-items:center;gap:6px;
    opacity:0;
    transform:scale(0.85);
    transition:opacity .3s ease .12s, transform .3s ease .12s;
    white-space:nowrap;
  }
  .phone-notch.expanded .notch-content{opacity:1;transform:scale(1);}
  .notch-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--md-primary);
    flex-shrink:0;
    animation:pulse-dot 1.4s infinite ease-in-out;
  }
  @keyframes pulse-dot{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.4;transform:scale(0.7);}
  }
  .notch-label{
    font-size:9px;font-weight:700;letter-spacing:0.6px;
    color:var(--md-on-surface);
  }
  .toast{display:none;}

  .phone-header{
    padding:36px 14px 10px;
    background:var(--md-surface-container-highest);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.05);
    z-index:30;
  }
  .header-left{display:flex;align-items:center;gap:8px;}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--md-primary);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#381E72;
    position:relative;flex-shrink:0;
  }
  .status-dot{
    position:absolute;bottom:-1px;right:-1px;
    width:8px;height:8px;background:var(--md-success);border-radius:50%;
    border:2px solid var(--md-surface-container-highest);
  }
  .header-name{font-weight:700;color:#fff;font-size:12px;line-height:1.2;}
  .header-sub{font-size:9px;color:var(--md-primary);font-weight:600;}
  .header-icon{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--md-outline);font-size:16px;
  }

  .chat-scroll{
    flex:1;
    background:var(--md-surface-container-low);
    padding:10px 8px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:10.5px;
  }
  .chat-scroll::-webkit-scrollbar{width:3px;}
  .chat-scroll::-webkit-scrollbar-thumb{background:var(--md-outline-variant);border-radius:3px;}

  .bubble-row{display:flex; animation:bubble-in .35s cubic-bezier(.2,.8,.2,1);}
  .bubble-row.user{justify-content:flex-end;}
  .bubble-row.bot{justify-content:flex-start;}
  @keyframes bubble-in{
    from{opacity:0;transform:translateY(8px) scale(0.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .bubble-user{
    background:var(--md-primary-container);
    color:var(--md-on-primary-container);
    padding:7px 10px;
    border-radius:16px 16px 4px 16px;
    max-width:82%;
    font-size:10.5px;
    line-height:1.4;
  }
  .bubble-time{font-size:8px;color:var(--md-outline);text-align:right;margin-top:2px;}

  .xgo-card{
    background:var(--md-surface-container);
    border:1px solid var(--md-outline-variant);
    border-radius:16px 16px 16px 4px;
    padding:9px 10px;
    max-width:94%;
    color:var(--md-on-surface);
    font-size:9.5px;
    line-height:1.45;
    transition:background .3s ease, border-color .3s ease;
  }
  .xgo-card-inner{
    animation:card-fade .28s ease;
  }
  @keyframes card-fade{
    from{opacity:0;transform:translateY(3px);}
    to{opacity:1;transform:translateY(0);}
  }
  .xgo-header{
    font-weight:700;font-size:9.5px;margin-bottom:2px;
    display:flex;flex-wrap:wrap;align-items:center;gap:3px;
  }
  .tag-primary{color:var(--md-primary);}
  .tag-dim{color:var(--md-outline);font-size:8.5px;}
  code{
    color:var(--md-secondary);
    font-family:ui-monospace,Menlo,monospace;font-size:8px;
    background:rgba(255,255,255,0.05);
    padding:0 3px;border-radius:4px;
  }
  .block-label{
    font-weight:700;font-size:9px;margin:5px 0 3px;
    display:flex;align-items:center;gap:3px;color:var(--md-on-surface-variant);
  }
  .block-label .material-symbols-rounded{font-size:12px;color:var(--md-primary);}
  .mini-card{
    background:var(--md-surface-container-high);
    border:1px solid var(--md-outline-variant);
    border-radius:10px;
    padding:6px 8px;
    margin-bottom:5px;
    color:var(--md-on-surface);
    font-size:8.8px;
  }
  .mini-card.mono{font-family:ui-monospace,monospace;font-size:8px;}
  .xgo-answer{
    background:var(--md-surface-container-high);
    border:1px solid var(--md-outline-variant);
    border-radius:10px;
    padding:7px 8px;
    color:var(--md-on-surface);
    font-size:9.2px;
  }
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:7px;}
  .btn-row.single{grid-template-columns:1fr;}
  .xgo-btn{
    background:var(--md-surface-container-high);
    border:1px solid var(--md-outline-variant);
    color:var(--md-on-surface);
    border-radius:999px;
    padding:6px 4px;
    font-size:7.8px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    display:flex;align-items:center;justify-content:center;gap:3px;
    transition:background .2s ease, transform .15s cubic-bezier(.3,1.5,.4,1), border-color .2s ease;
  }
  .xgo-btn:active{transform:scale(0.94);}
  .xgo-btn:hover{background:var(--md-surface-container-highest); border-color:var(--md-primary);}
  .xgo-btn .material-symbols-rounded{font-size:11px;color:var(--md-primary);}
  .xgo-btn.primary{
    background:var(--md-primary);
    color:#381E72;
    border-color:var(--md-primary);
  }
  .xgo-btn.primary .material-symbols-rounded{color:#381E72;}

  .thinking-dots{display:flex;gap:3px;padding:6px 0;}
  .thinking-dots span{
    width:5px;height:5px;border-radius:50%;
    background:var(--md-outline);
    animation:blink 1.2s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2){animation-delay:0.2s;}
  .thinking-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

  .tree-line{font-size:8.6px;margin:2px 0;display:flex;align-items:flex-start;gap:3px;}
  .tree-line .material-symbols-rounded{font-size:11px;flex-shrink:0;margin-top:0.5px;}
  .tree-line.active{color:var(--md-on-surface);}
  .tree-line.done{color:var(--md-outline);}
  .tree-line.active .material-symbols-rounded{color:var(--md-primary);}
  .tree-line.done .material-symbols-rounded{color:var(--md-success);}

  .full-node{display:flex;gap:6px;margin-bottom:1px;position:relative;}
  .full-node-line{width:14px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
  .full-node-dot{
    width:16px;height:16px;border-radius:50%;
    background:var(--md-surface-container-high);
    border:1px solid var(--md-success);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;color:var(--md-success);flex-shrink:0;margin-top:1px;
  }
  .full-node-dot .material-symbols-rounded{font-size:9px;}
  .full-node-dot.tool{border-color:var(--md-primary);color:var(--md-primary);}
  .full-node-connector{flex:1;width:1px;background:var(--md-outline-variant);margin:2px 0;min-height:6px;}
  .full-node-content{flex:1;padding-bottom:9px;font-size:8.6px;color:var(--md-on-surface);line-height:1.45;}
  .full-node-label{font-weight:700;font-size:8.2px;color:var(--md-outline);margin-bottom:1px;}
  .full-node-code{
    font-family:ui-monospace,monospace;font-size:7.3px;color:var(--md-secondary);
    background:rgba(0,0,0,0.25);border:1px solid var(--md-outline-variant);border-radius:5px;
    padding:2px 5px;margin-top:2px;display:inline-block;
  }

  .file-row, .hist-row{
    background:var(--md-surface-container-high);
    border:1px solid var(--md-outline-variant);
    border-radius:10px;
    padding:6px 8px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:8.5px;
    color:var(--md-on-surface);
    margin-bottom:5px;
  }
  .file-row a{color:var(--md-primary);text-decoration:none;font-weight:600;}
  .file-row-name{display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;}
  .file-row-name .material-symbols-rounded{font-size:11px;color:var(--md-primary);flex-shrink:0;}

  .page-nav{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:6px 0;font-size:8.5px;color:var(--md-outline);
  }
  .page-nav .xgo-btn{padding:4px 8px;font-size:8px;}

  .input-bar{
    padding:8px 8px;
    background:var(--md-surface-container-highest);
    display:flex;align-items:center;gap:6px;z-index:30;
  }
  .input-field{
    flex:1;height:30px;
    background:var(--phone-frame);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:15px;padding:0 10px;
    color:rgba(255,255,255,0.35);font-size:10px;
    display:flex;align-items:center;
  }
  .send-btn{
    width:30px;height:30px;border-radius:50%;
    background:var(--md-primary);border:none;
    display:flex;align-items:center;justify-content:center;
    color:#381E72;font-size:14px;opacity:0.4;
  }

  .hint-text{color:#6b6b6b;font-size:11px;text-align:center;margin-top:14px;max-width:300px;}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;align-items:center;">
  <div class="phone-container">
    <div class="phone-mockup">

      <div class="status-bar">
        <div class="status-time" id="statusTime">--:--</div>
        <div class="status-icons">
          <svg width="15" height="11" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
          <svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M8 10.2c.6 0 1-.5 1-1s-.5-1-1-1-1 .5-1 1 .4 1 1 1z" fill="#fff"/><path d="M4.5 7c1-1 2.2-1.5 3.5-1.5S10.5 6 11.5 7" stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none"/><path d="M2 4.3c1.7-1.7 4-2.6 6-2.6s4.3.9 6 2.6" stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
          <div class="battery-shell">
            <div class="battery-fill" id="batteryFill" style="width:100%;"></div>
            <span class="charging-bolt" id="chargingBolt" style="display:none;">&#9889;</span>
          </div>
        </div>
      </div>

      <div class="phone-notch" id="phoneNotch">
        <div class="notch-content">
          <span class="notch-dot"></span>
          <span class="notch-label">TO BE CONTINUE</span>
        </div>
      </div>

      <div class="phone-header">
        <div class="header-left">
          <div class="avatar">X<span class="status-dot"></span></div>
          <div>
            <div class="header-name">XGO Panel</div>
            <div class="header-sub">bot · online</div>
          </div>
        </div>
        <div class="header-icon"><span class="material-symbols-rounded">more_vert</span></div>
      </div>

      <div class="chat-scroll" id="chatScroll"></div>

      <div class="input-bar">
        <div class="input-field">/ask ...</div>
        <div class="send-btn"><span class="material-symbols-rounded" style="font-size:14px;">send</span></div>
      </div>

    </div>
  </div>
  <div class="hint-text">Демо запускается автоматически — бот сам отправляет запрос из скрина и строит реальное дерево рассуждений.</div>
</div>

<script>
function updateStatusTime(){
  var now = new Date();
  var h = now.getHours().toString().padStart(2,'0');
  var m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('statusTime').textContent = h + ':' + m;
}
updateStatusTime();
setInterval(updateStatusTime, 15000);

(function(){
  var notch = document.getElementById('phoneNotch');
  var timer = null;
  notch.addEventListener('click', function(){
    notch.classList.add('expanded');
    clearTimeout(timer);
    timer = setTimeout(function(){
      notch.classList.remove('expanded');
    }, 1800);
  });
})();

(function simulateBattery(){
  var fill = document.getElementById('batteryFill');
  var bolt = document.getElementById('chargingBolt');
  var level = 62;
  var charging = true;
  function render(){
    fill.style.width = level + '%';
    fill.className = 'battery-fill' + (level < 20 ? ' low' : '') + (charging ? ' charging' : '');
    bolt.style.display = charging ? 'block' : 'none';
  }
  render();
  setInterval(function(){
    if(charging){
      level = Math.min(100, level + 1);
      if(level >= 100) charging = false;
    }
    render();
  }, 4000);
})();

var chatScroll = document.getElementById('chatScroll');
var requestCounter = 0;
var responseCache = {};

function scrollToBottom(){ chatScroll.scrollTop = chatScroll.scrollHeight; }

function addUserBubble(text){
  var row = document.createElement('div');
  row.className = 'bubble-row user';
  var wrap = document.createElement('div');
  var b = document.createElement('div');
  b.className = 'bubble-user';
  b.textContent = text;
  wrap.appendChild(b);
  var t = document.createElement('div');
  t.className = 'bubble-time';
  var d = new Date();
  t.textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  wrap.appendChild(t);
  row.appendChild(wrap);
  chatScroll.appendChild(row);
  scrollToBottom();
}

var REAL_FILES = [
  'https://x0.at/FrdQ.svg',
  'https://x0.at/6ofq.svg',
  'https://x0.at/kbAP.svg',
  'https://x0.at/MxiK.svg',
  'https://x0.at/7Ggj.svg'
];

function buildReasoning(prompt){
  var p = prompt.toLowerCase();
  var nodes = [];
  var tools = [];
  var toolCalls = [];
  var answerParts = [];
  var needsChart = /график|диаграм|chart|bar|line|pie|radar|scatter/.test(p);

  nodes.push({type:'think', label:'Разбор запроса', detail:'Пользователь написал на русском: "' + prompt + '". Это запрос про ' + (needsChart ? 'создание диаграмм' : 'информацию') + '.'});

  if(needsChart){
    nodes.push({type:'think', label:'Планирование', detail:'Нужно продемонстрировать все поддерживаемые типы диаграмм на примере одной темы для наглядности.'});

    var chartTypes = [
      {type:'bar', label:'Bar (столбчатая)', args:"labels=['Windows','macOS','Linux','ChromeOS','Другие']"},
      {type:'line', label:'Line (линейная)', args:"labels=['2019','2020','2021','2022','2023']"},
      {type:'pie', label:'Pie/Donut (круговая)', args:"labels=['Linux','Windows','Другие']"},
      {type:'radar', label:'Radar (радарная)', args:"labels=['игры','безопасность','кастомизация']"},
      {type:'scatter', label:'Scatter (точечная)', args:"x='ОЗУ', y='время загрузки'"}
    ];

    chartTypes.forEach(function(ct, i){
      toolCalls.push({name:'chart', args:'type=' + ct.type + ', ' + ct.args});
      tools.push({
        name:'chart',
        result:'Chart rendered: chart_' + Math.random().toString(16).slice(2,10) + '.svg',
        url: REAL_FILES[i % REAL_FILES.length],
        filename: 'chart_' + ct.type + '.svg'
      });
      nodes.push({type:'tool', label:'chart(' + ct.type + ')', detail:ct.label + ' — вызван инструмент рендера графика.', code:'chart(type=' + ct.type + ', ' + ct.args + ')'});
    });

    nodes.push({type:'think', label:'Сборка ответа', detail:'Собрал все 5 типов диаграмм в единый структурированный ответ с примерами на тему Linux vs Windows.'});

    answerParts.push('Вот все пять типов диаграмм, которые я могу создавать — на примере темы Linux vs Windows:');
    answerParts.push('<br><br><b>1. Bar (столбчатая)</b> — сравнение категорий между собой. Доля ОС на десктопах.');
    answerParts.push('<br><b>2. Line (линейная)</b> — тренды во времени, несколько рядов сразу.');
    answerParts.push('<br><b>3. Pie/Donut (круговая)</b> — доли от целого, например ОС на серверах.');
    answerParts.push('<br><b>4. Radar (радарная)</b> — многомерное сравнение по нескольким осям.');
    answerParts.push('<br><b>5. Scatter (точечная)</b> — связь между двумя числовыми величинами.');
    answerParts.push('<br><br>Цифры в примерах приблизительные. Могу построить любую диаграмму с вашими реальными данными.');
  } else {
    nodes.push({type:'think', label:'Прямой ответ', detail:'Инструменты не требуются, отвечаю на основе контекста и памяти о проекте (mode: direct).'});
    answerParts.push('Отвечаю на основе контекста диалога и памяти о твоём проекте.');
  }

  nodes.push({type:'think', label:'Финализация', detail:'Ответ сформирован, готов к отправке пользователю.'});

  return { nodes: nodes, toolCalls: toolCalls, tools: tools, answerParts: answerParts };
}

var TREE_PAGE_SIZE = 4;

function buildTreeHTML(reqId, page){
  page = page || 0;
  var d = responseCache[reqId];
  var nodes = d.reasoning.nodes;
  var totalPages = Math.max(1, Math.ceil(nodes.length / TREE_PAGE_SIZE));
  page = Math.max(0, Math.min(page, totalPages - 1));
  var start = page * TREE_PAGE_SIZE;
  var pageNodes = nodes.slice(start, start + TREE_PAGE_SIZE);

  var html = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">account_tree</span> Дерево рассуждений</div>';
  html += '<div style="margin:5px 0 4px;">';
  pageNodes.forEach(function(node, i){
    var isLast = i === pageNodes.length - 1;
    var isTool = node.type === 'tool';
    html += '<div class="full-node">';
    html += '<div class="full-node-line">';
    html += '<div class="full-node-dot' + (isTool ? ' tool' : '') + '"><span class="material-symbols-rounded">' + (isTool ? 'settings' : 'psychology') + '</span></div>';
    if(!isLast) html += '<div class="full-node-connector"></div>';
    html += '</div>';
    html += '<div class="full-node-content">';
    html += '<div class="full-node-label">' + node.label + '</div>';
    html += '<div>' + node.detail + '</div>';
    if(node.code) html += '<div class="full-node-code">' + node.code + '</div>';
    html += '</div></div>';
  });
  html += '</div>';

  html += '<div class="page-nav">';
  if(page > 0) html += '<button class="xgo-btn" data-action="treepage" data-id="' + reqId + '" data-page="' + (page-1) + '"><span class="material-symbols-rounded">chevron_left</span></button>';
  html += '<span>' + (page+1) + '/' + totalPages + '</span>';
  if(page < totalPages - 1) html += '<button class="xgo-btn" data-action="treepage" data-id="' + reqId + '" data-page="' + (page+1) + '"><span class="material-symbols-rounded">chevron_right</span></button>';
  html += '</div>';

  html += '<div class="btn-row single">';
  html += '<button class="xgo-btn" data-action="log" data-id="' + reqId + '"><span class="material-symbols-rounded">terminal</span>Лог действий</button>';
  html += '</div>';
  html += '<div class="btn-row single">';
  html += '<button class="xgo-btn primary" data-action="backresult" data-id="' + reqId + '"><span class="material-symbols-rounded">arrow_back</span>К ответу</button>';
  html += '</div>';
  return html;
}

function buildLogHTML(reqId){
  var d = responseCache[reqId];
  var html = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">terminal</span> Лог действий</div>';
  html += '<div class="mini-card mono">';
  if(d.reasoning.toolCalls.length === 0){
    html += '<span class="tag-dim">Тулы в этом ответе не вызывались.</span>';
  } else {
    d.reasoning.toolCalls.forEach(function(tc){
      html += '&#9881; ' + tc.name + '(<code>' + tc.args.replace(/</g,'&lt;') + '</code>)<br><br>';
    });
  }
  html += '</div>';
  html += '<div class="btn-row single">';
  html += '<button class="xgo-btn primary" data-action="tree" data-id="' + reqId + '"><span class="material-symbols-rounded">arrow_back</span>Назад к дереву</button>';
  html += '</div>';
  return html;
}

function buildFilesHTML(reqId){
  var d = responseCache[reqId];
  var files = d.reasoning.tools.filter(function(t){ return t.url; });
  var html = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">folder</span> Файлы этого ответа</div>';
  if(files.length === 0){
    html += '<div class="mini-card"><span class="tag-dim">В этом ответе файлы не создавались.</span></div>';
  } else {
    files.forEach(function(f, i){
      html += '<div class="file-row">';
      html += '<div class="file-row-name"><span class="material-symbols-rounded">description</span>' + (i+1) + '. ' + f.filename + '</div>';
      html += '<a href="' + f.url + '" target="_blank" rel="noopener">открыть</a>';
      html += '</div>';
    });
  }
  html += '<div class="btn-row single">';
  html += '<button class="xgo-btn primary" data-action="backresult" data-id="' + reqId + '"><span class="material-symbols-rounded">arrow_back</span>К ответу</button>';
  html += '</div>';
  return html;
}

var HISTORY_LOG = [];

function buildHistoryHTML(reqId){
  var html = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">history</span> История чата</div>';
  if(HISTORY_LOG.length === 0){
    html += '<div class="mini-card"><span class="tag-dim">История пуста</span></div>';
  } else {
    HISTORY_LOG.slice(-10).forEach(function(h){
      html += '<div class="hist-row"><span class="material-symbols-rounded" style="font-size:10px;color:var(--md-primary);">' + (h.role==='user'?'person':'smart_toy') + '</span>&nbsp;' + h.text.replace(/</g,'&lt;') + '</div>';
    });
  }
  html += '<div class="btn-row single">';
  html += '<button class="xgo-btn primary" data-action="backresult" data-id="' + reqId + '"><span class="material-symbols-rounded">arrow_back</span>К ответу</button>';
  html += '</div>';
  return html;

function setCard(card, html){
  card.innerHTML = '<div class="xgo-card-inner">' + html + '</div>';
}

chatScroll.addEventListener('click', function(e){
  var btn = e.target.closest('.xgo-btn');
  if(!btn) return;
  var action = btn.getAttribute('data-action');
  var reqId = btn.getAttribute('data-id');
  var card = btn.closest('.xgo-card');
  if(!card || !reqId) return;

  if(action === 'tree'){
    setCard(card, buildTreeHTML(reqId, 0));
  } else if(action === 'treepage'){
    var page = parseInt(btn.getAttribute('data-page'), 10);
    setCard(card, buildTreeHTML(reqId, page));
  } else if(action === 'log'){
    setCard(card, buildLogHTML(reqId));
  } else if(action === 'files'){
    setCard(card, buildFilesHTML(reqId));
  } else if(action === 'history'){
    setCard(card, buildHistoryHTML(reqId));
  } else if(action === 'backresult'){
    setCard(card, buildAnswerHTML(reqId));
  } else if(action === 'clear'){
    HISTORY_LOG = [];
    card.innerHTML = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">check_circle</span> История очищена</div>';
    setTimeout(function(){ setCard(card, buildAnswerHTML(reqId)); }, 900);
  } else if(action === 'regen' || action === 'continue' || action === 'regen_prompt'){
    var d = responseCache[reqId];
    HISTORY_LOG.push({role:'user', text: action === 'regen_prompt' ? 'Реген: ' + d.prompt : d.prompt});
    requestCounter++;
    runStepwiseGeneration(d.prompt, requestCounter, card.closest('.bubble-row'));
  }
});

function runStepwiseGeneration(prompt, reqId, existingRow){
  var row, card;
  if(existingRow){
    row = existingRow;
    card = row.querySelector('.xgo-card');
  } else {
    row = document.createElement('div');
    row.className = 'bubble-row bot';
    card = document.createElement('div');
    card.className = 'xgo-card';
    row.appendChild(card);
    chatScroll.appendChild(row);
  }

  var startTs = Date.now();
  var treeNodes = [];
  var tokens = 0;
  var reasoning = buildReasoning(prompt);

  function pushNode(label, state){ treeNodes.push({label:label, state: state || 'active'}); }
  function setLastState(state){ if(treeNodes.length) treeNodes[treeNodes.length-1].state = state; }

  function renderTreeStatus(){
    var html = '<div class="xgo-header"><span class="material-symbols-rounded tag-primary" style="font-size:12px;">psychology</span> <b>XGO Agent</b> <span class="tag-dim">&#183; рассуждаю...</span></div>';
    html += '<div style="margin-top:4px;">';
    treeNodes.forEach(function(node){
      var icon = node.state === 'active' ? 'hourglass_empty' : (node.state === 'error' ? 'close' : 'check_circle');
      html += '<div class="tree-line ' + node.state + '"><span class="material-symbols-rounded">' + icon + '</span>' + node.label + '</div>';
    });
    html += '</div>';
    card.innerHTML = html;
    scrollToBottom();
  }

  var steps = [];

  steps.push(function(next){
    pushNode('Анализирую запрос...', 'active');
    renderTreeStatus();
    setTimeout(function(){ setLastState('done'); next(); }, 550);
  });

  steps.push(function(next){
    pushNode(reasoning.nodes[0].label + '...', 'active');
    renderTreeStatus();
    setTimeout(function(){ setLastState('done'); next(); }, 500);
  });

  if(reasoning.nodes[1] && reasoning.nodes[1].type === 'think'){
    steps.push(function(next){
      pushNode(reasoning.nodes[1].label + '...', 'active');
      renderTreeStatus();
      setTimeout(function(){ setLastState('done'); next(); }, 500);
    });
  }

  reasoning.toolCalls.forEach(function(tc){
    steps.push(function(next){
      pushNode('<code>' + tc.name + '</code>(' + tc.args.slice(0,26) + (tc.args.length>26?'…':'') + ')', 'active');
      renderTreeStatus();
      setTimeout(function(){
        setLastState('done');
        tokens += Math.floor(Math.random()*180+70);
        renderTreeStatus();
        next();
      }, 460);
    });
  });

  var finalNode = reasoning.nodes[reasoning.nodes.length - 1];
  steps.push(function(next){
    pushNode(finalNode.label + '...', 'active');
    renderTreeStatus();
    setTimeout(function(){ setLastState('done'); next(); }, 500);
  });

  function runSteps(i){
    if(i >= steps.length){
      tokens += Math.floor(Math.random()*400+300);
      var elapsed = ((Date.now() - startTs) / 1000).toFixed(1);
      responseCache[reqId] = { prompt: prompt, reasoning: reasoning, elapsed: elapsed, tokens: tokens };
      HISTORY_LOG.push({role:'assistant', text: reasoning.answerParts.join('').replace(/<[^>]+>/g,'').slice(0,150) + '...'});
      setCard(card, buildAnswerHTML(reqId));
      scrollToBottom();
      return;
    }
    steps[i](function(){ runSteps(i+1); });
  }
  runSteps(0);
}

var initialPrompt = 'Создание диаграмм: bar/line/pie/radar/scatter';

window.addEventListener('load', function(){
  setTimeout(function(){
    addUserBubble(initialPrompt);
    HISTORY_LOG.push({role:'user', text: initialPrompt});
    requestCounter++;
    runStepwiseGeneration(initialPrompt, requestCounter);
  }, 700);
});
